<html lang="ja">

<meta charset="utf-8" />

<title>シス単5訂版 単語テスト</title>
<style>
body {
  margin: 0;
  font-family: system-ui, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  color: #222;
}
#root { max-width: 480px; margin: 0 auto; padding: 16px; }

h1 { font-size: 18px; margin: 4px 0; }
h2 { font-size: 13px; color: #666; margin: 16px 0 6px; }
.sub { color: #666; font-size: 13px; margin: 0 0 8px; }

section { margin-bottom: 12px; }

.check-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin: 0 12px 6px 0;
  font-size: 14px;
}
.field-inline { display: block; font-size: 13px; color: #666; margin-bottom: 8px; }

.text-input {
  font-size: 14px;
  padding: 6px 8px;
  border: 1px solid #ccc;
  width: 100%;
  margin-top: 4px;
}
.text-input.small { width: 100px; margin-left: 8px; }
.hint { font-size: 12px; color: #888; margin: 4px 0 0; }

.main-btn {
  display: block;
  width: 100%;
  padding: 10px;
  font-size: 15px;
  border: 1px solid #333;
  background: #333;
  color: #fff;
  cursor: pointer;
  margin-top: 12px;
}
.main-btn:disabled { opacity: .4; cursor: not-allowed; }
.main-btn.small { width: auto; padding: 8px 20px; }

.text-btn { background: none; border: none; color: #333; font-size: 14px; cursor: pointer; padding: 6px 4px; }
.text-btn:disabled { opacity: .3; cursor: default; }
.text-btn.block { display: block; width: 100%; text-align: center; margin-top: 10px; text-decoration: underline; }

.top-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #666;
  margin-bottom: 12px;
}

.card-area {
  border: 1px solid #ccc;
  padding: 40px 16px;
  text-align: center;
  cursor: pointer;
  min-height: 160px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.no-label { font-size: 12px; color: #888; margin-bottom: 12px; }
.front { font-size: 24px; font-weight: 600; }
.back { font-size: 17px; color: #333; margin-top: 16px; }
.back.placeholder { color: #aaa; font-size: 14px; }

.btn-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
}

</style>
</head>

<script>
const { useState, useMemo, useEffect } = React;
const h = React.createElement;

const SETTINGS_KEY = "vocabFlashSettings_v1";

function loadSettings() {
  const defaults = {
    rangeSpec: "",
    count: "",
    order: "sequential",
    direction: "e2j", // e2j: 英語→日本語, j2e: 日本語→英語
  };
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
    if (saved && typeof saved === "object") {
      return Object.assign({}, defaults, saved);
    }
  } catch (e) {}
  return defaults;
}

function saveSettings(settings) {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) {}
}

function parseRanges(spec) {
  if (!spec || !spec.trim()) return null;
  const set = new Set();
  spec
    .split(",")
    .map((s) => s.trim())
    .filter(Boolean)
    .forEach((part) => {
      const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m) {
        let a = parseInt(m[1], 10);
        let b = parseInt(m[2], 10);
        if (a > b) [a, b] = [b, a];
        for (let n = a; n <= b; n++) set.add(n);
      } else if (/^\d+$/.test(part)) {
        set.add(parseInt(part, 10));
      }
    });
  return set;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getFilteredPool(settings) {
  const allowed = parseRanges(settings.rangeSpec);
  return WORDS.filter((w) => {
    const no = w[0];
    if (allowed && !allowed.has(no)) return false;
    return true;
  });
}

function buildCards(pool, settings) {
  let ordered = settings.order === "random" ? shuffle(pool) : pool.slice().sort((a, b) => a[0] - b[0]);
  const countNum = settings.count.trim() === "" ? ordered.length : Math.max(1, parseInt(settings.count, 10) || ordered.length);
  return ordered.slice(0, Math.min(countNum, ordered.length));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function openWordListTab() {
  const rows = WORDS.map(
    (w) =>
      "<tr><td>" +
      w[0] +
      "</td><td>" +
      escapeHtml(w[1]) +
      "</td><td>" +
      escapeHtml(w[2]) +
      "</td></tr>"
  ).join("");

  const html =
    '<!doctype html><html lang="ja"><head><meta charset="utf-8">' +
    "<title>シス単5訂版 単語リスト</title>" +
    "<style>" +
    "body{font-family:system-ui,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;margin:16px;color:#222;}" +
    "h1{font-size:16px;}" +
    "input{font-size:14px;padding:6px 8px;border:1px solid #ccc;width:100%;max-width:320px;margin-bottom:10px;box-sizing:border-box;}" +
    "table{border-collapse:collapse;width:100%;font-size:14px;}" +
    "th,td{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left;}" +
    "th{color:#666;font-weight:normal;position:sticky;top:0;background:#fff;}" +
    "td:first-child{color:#888;width:50px;}" +
    "tr.hidden{display:none;}" +
    "</style></head><body>" +
    "<h1>シス単5訂版 単語リスト（全" +
    WORDS.length +
    "語）</h1>" +
    '<input id="filter" type="text" placeholder="検索（単語・意味）" oninput="filterRows()">' +
    '<table><thead><tr><th>No.</th><th>単語</th><th>意味</th></tr></thead><tbody id="tbody">' +
    rows +
    "</tbody></table>" +
    "<script>" +
    "function filterRows(){" +
    "var q=document.getElementById('filter').value.trim().toLowerCase();" +
    "var trs=document.getElementById('tbody').getElementsByTagName('tr');" +
    "for(var i=0;i<trs.length;i++){" +
    "var t=trs[i].textContent.toLowerCase();" +
    "trs[i].className=(q&&t.indexOf(q)===-1)?'hidden':'';" +
    "}}" +
    "</" +
    "script>" +
    "</body></html>";

  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
}

function openPrintTestTab(settings) {
  const pool = getFilteredPool(settings);
  if (pool.length === 0) {
    alert("条件に一致する単語がありません。");
    return;
  }
  const cards = buildCards(pool, settings);
  const direction = settings.direction;

  const rangeLabel = settings.rangeSpec && settings.rangeSpec.trim() ? settings.rangeSpec.trim() : "全範囲";
  const directionLabel = direction === "e2j" ? "単語 → 意味" : "意味 → 単語";
  const orderLabel = settings.order === "random" ? "ランダム" : "No.順";

  const qRows = cards
    .map((w, i) => {
      const front = direction === "e2j" ? w[1] : w[2];
      return (
        '<div class="q-item"><span class="q-no">' +
        (i + 1) +
        "</span><span class=\"q-front\">" +
        escapeHtml(front) +
        '</span><span class="q-blank"></span></div>'
      );
    })
    .join("");

  const aRows = cards
    .map((w, i) => {
      const front = direction === "e2j" ? w[1] : w[2];
      const back = direction === "e2j" ? w[2] : w[1];
      return (
        "<tr><td>" +
        (i + 1) +
        "</td><td>" +
        escapeHtml(front) +
        "</td><td>" +
        escapeHtml(back) +
        "</td></tr>"
      );
    })
    .join("");

  const html =
    '<!doctype html><html lang="ja"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    "<title>シス単5訂版 単語テスト（印刷用）</title>" +
    "<style>" +
    "* { box-sizing: border-box; }" +
    "body{font-family:system-ui,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;margin:24px;color:#222;}" +
    ".no-print{margin-bottom:16px;}" +
    ".no-print button{font-size:14px;padding:8px 18px;border:1px solid #333;background:#333;color:#fff;cursor:pointer;margin-right:8px;}" +
    ".no-print button.secondary{background:#fff;color:#333;}" +
    "h1{font-size:18px;margin:0 0 4px;}" +
    ".meta{font-size:13px;color:#555;margin-bottom:6px;}" +
    ".info-line{display:flex;gap:24px;font-size:14px;margin:14px 0 18px;border-top:1px solid #999;border-bottom:1px solid #999;padding:8px 0;}" +
    ".info-line span{white-space:nowrap;}" +
    ".fill-line{display:inline-block;border-bottom:1px solid #333;min-width:110px;}" +
    ".q-list{column-count:2;column-gap:28px;}" +
    ".q-item{display:flex;align-items:baseline;break-inside:avoid;padding:6px 0;border-bottom:1px dotted #ccc;}" +
    ".q-no{width:26px;flex:none;color:#666;font-size:13px;}" +
    ".q-front{flex:none;font-size:14px;min-width:120px;padding-right:8px;}" +
    ".q-blank{flex:1;border-bottom:1px solid #333;min-height:1.1em;}" +
    ".answer-page{page-break-before:always;margin-top:8px;}" +
    ".answer-page h2{font-size:15px;margin:0 0 10px;}" +
    "table{border-collapse:collapse;width:100%;font-size:13px;}" +
    "table.ans-table{column-count:2;column-gap:28px;}" +
    "th,td{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left;}" +
    "th{color:#666;font-weight:normal;}" +
    "td:first-child,th:first-child{color:#888;width:34px;}" +
    "@media print{ .no-print{display:none;} body{margin:12mm;} }" +
    "</style></head><body>" +
    '<div class="no-print"><button onclick="window.print()">印刷する</button><button class="secondary" onclick="window.close()">閉じる</button></div>' +
    "<h1>シス単5訂版 単語テスト</h1>" +
    '<div class="meta">出題範囲: No. ' +
    escapeHtml(rangeLabel) +
    "　/　出題数: " +
    cards.length +
    "問　/　順序: " +
    orderLabel +
    "　/　出題形式: " +
    directionLabel +
    "</div>" +
    '<div class="info-line"><span>得点：<span class="fill-line">&nbsp;</span>／' +
    cards.length +
    "</span></div>" +
    '<div class="q-list">' +
    qRows +
    "</div>" +
    '<div class="answer-page"><h2>解答</h2><table class="ans-table"><tbody>' +
    aRows +
    "</tbody></table></div>" +
    "</body></html>";

  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
}

function App() {
  const [settings, setSettings] = useState(loadSettings);
  const [screen, setScreen] = useState("setup"); // setup | study | done
  const [cards, setCards] = useState([]);
  const [index, setIndex] = useState(0);
  const [revealed, setRevealed] = useState(false);

  useEffect(() => {
    saveSettings(settings);
  }, [settings]);

  const poolSize = useMemo(() => getFilteredPool(settings).length, [settings]);

  function start() {
    const pool = getFilteredPool(settings);
    if (pool.length === 0) {
      alert("条件に一致する単語がありません。");
      return;
    }
    setCards(buildCards(pool, settings));
    setIndex(0);
    setRevealed(false);
    setScreen("study");
  }

  function next() {
    if (index + 1 >= cards.length) {
      setScreen("done");
      return;
    }
    setIndex((i) => i + 1);
    setRevealed(false);
  }

  function prev() {
    if (index === 0) return;
    setIndex((i) => i - 1);
    setRevealed(false);
  }

  function onKeyDown(e) {
    if (screen !== "study") return;
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      setRevealed((r) => !r);
    } else if (e.key === "ArrowRight") {
      next();
    } else if (e.key === "ArrowLeft") {
      prev();
    }
  }

  useEffect(() => {
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  });

  if (screen === "setup") return h(SetupScreen, { settings, setSettings, poolSize, start });
  if (screen === "study")
    return h(StudyScreen, {
      card: cards[index],
      index,
      total: cards.length,
      revealed,
      direction: settings.direction,
      setRevealed,
      next,
      prev,
      backToSetup: () => setScreen("setup"),
    });
  return h(DoneScreen, { total: cards.length, restart: start, backToSetup: () => setScreen("setup") });
}

function SetupScreen({ settings, setSettings, poolSize, start }) {
  return h(
    "div",
    { className: "screen" },
    h("h1", null, "シス単5訂版 単語テスト"),
    h("p", { className: "sub" }, "全 " + WORDS.length + " 語"),

    h("section", null,
      h("h2", null, "範囲指定（No.）"),
      h("input", {
        type: "text",
        className: "text-input",
        placeholder: "例: 1-100, 250-300（空欄で全範囲）",
        value: settings.rangeSpec,
        onChange: (e) => setSettings((s) => ({ ...s, rangeSpec: e.target.value })),
      }),
      h("p", { className: "hint" }, "対象: " + poolSize + " 語")
    ),

    h("section", null,
      h("h2", null, "出題数・順序"),
      h("label", { className: "field-inline" },
        "出題数（空欄で全問）",
        h("input", {
          type: "number",
          min: 1,
          className: "text-input small",
          value: settings.count,
          onChange: (e) => setSettings((s) => ({ ...s, count: e.target.value })),
        })
      ),
      h("label", { className: "field-inline" },
        "順序",
        h("select", {
          className: "text-input small",
          value: settings.order,
          onChange: (e) => setSettings((s) => ({ ...s, order: e.target.value })),
        },
          h("option", { value: "sequential" }, "No.順"),
          h("option", { value: "random" }, "ランダム")
        )
      )
    ),

    h("section", null,
      h("h2", null, "表示"),
      h("label", { className: "check-item" },
        h("input", {
          type: "radio",
          name: "direction",
          checked: settings.direction === "e2j",
          onChange: () => setSettings((s) => ({ ...s, direction: "e2j" })),
        }),
        "単語 → 意味"
      ),
      h("label", { className: "check-item" },
        h("input", {
          type: "radio",
          name: "direction",
          checked: settings.direction === "j2e",
          onChange: () => setSettings((s) => ({ ...s, direction: "j2e" })),
        }),
        "意味 → 単語"
      )
    ),

    h("button", { className: "main-btn", onClick: start, disabled: poolSize === 0 }, "開始"),
    h(
      "button",
      { className: "text-btn block", onClick: () => openPrintTestTab(settings), disabled: poolSize === 0 },
      "指定範囲のテストを印刷用に別タブで開く"
    ),
    h("button", { className: "text-btn block", onClick: openWordListTab }, "単語リストを別タブで表示")
  );
}

function StudyScreen({ card, index, total, revealed, direction, setRevealed, next, prev, backToSetup }) {
  if (!card) return null;
  const [no, word, meaning] = card;
  const front = direction === "e2j" ? word : meaning;
  const back = direction === "e2j" ? meaning : word;

  return h(
    "div",
    { className: "screen" },
    h("div", { className: "top-row" },
      h("button", { className: "text-btn", onClick: backToSetup }, "← 設定"),
      h("span", null, index + 1 + " / " + total)
    ),

    h("div", { className: "card-area", onClick: () => setRevealed((r) => !r) },
      h("div", { className: "no-label" }, "No. " + no),
      h("div", { className: "front" }, front),
      revealed ? h("div", { className: "back" }, back) : h("div", { className: "back placeholder" }, "（タップで表示）")
    ),

    h("div", { className: "btn-row" },
      h("button", { className: "text-btn", onClick: prev, disabled: index === 0 }, "前へ"),
      h("button", { className: "main-btn small", onClick: () => setRevealed((r) => !r) }, revealed ? "隠す" : "表示"),
      h("button", { className: "text-btn", onClick: next }, index + 1 >= total ? "終了" : "次へ")
    )
  );
}

function DoneScreen({ total, restart, backToSetup }) {
  return h(
    "div",
    { className: "screen" },
    h("h1", null, "終了"),
    h("p", null, total + " 語を学習しました。"),
    h("button", { className: "main-btn", onClick: restart }, "同じ条件でもう一度"),
    h("button", { className: "text-btn", onClick: backToSetup }, "設定に戻る")
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App));

</script>
</body>
</html>
